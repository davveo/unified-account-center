# 环境变量优先级高于本文件（容器 / KMS 注入敏感配置时使用）：
#   UAC_ADMIN_TOKEN            → admin.token
#   UAC_JWT_SECRET             → jwt.secret
#   UAC_JWT_PRIVATE_KEY_PATH   → jwt.private_key_path
#   UAC_JWT_PUBLIC_KEY_PATH    → jwt.public_key_path
#   UAC_DB_DSN                 → database.dsn
#   UAC_REDIS_ADDR             → redis.addr
#   UAC_REDIS_PASSWORD         → redis.password（允许显式置空）
# 链路追踪：OTEL_SERVICE_NAME 可覆盖 trace 日志中的 service 名（默认 unified-account-center）

server:
  addr: ":8080"
  mode: debug # debug | release
  public_base_url: "http://127.0.0.1:8080" # OIDC discovery / 网关对接用

admin:
  # 管理后台鉴权 Token，请求头：X-Admin-Token
  token: "admin-dev-token"

export:
  dir: "data/exports" # 审计 CSV 持久化（本地对象存储）

database:
  driver: mysql
  dsn: "root:root@tcp(127.0.0.1:3306)/unified_account?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle: 10
  max_open: 50

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

jwt:
  alg: RS256 # HS256 | RS256
  # 开发环境可用 HMAC；生产建议 RS256 私钥文件
  secret: "dev-change-me-unified-account-center-secret"
  issuer: "unified-account-center"
  access_ttl: 7200        # seconds
  refresh_ttl: 2592000    # seconds
  private_key_path: "configs/keys/jwt_rsa.pem"
  public_key_path: "configs/keys/jwt_rsa_pub.pem"
  kid: "rsa-1"
  # 双钥滚动（可选）：旧钥只验不签；管理端轮换后会自动写入 .prev 文件
  # previous_kid: "rsa-0"
  # previous_private_key_path: "configs/keys/jwt_rsa.prev.pem"
  # previous_public_key_path: "configs/keys/jwt_rsa_pub.prev.pem"

captcha:
  enabled: false
  provider: mock # mock | turnstile | recaptcha | geetest | yidun
  site_key: ""
  secret_key: ""
  captcha_id: ""   # 极验 captcha_id / 易盾 captchaId
  captcha_key: ""  # 极验 key / 易盾 secretKey

otp:
  length: 6
  ttl: 300
  resend_interval: 60
  max_tries: 5
  daily_limit_per_identity: 20
  daily_limit_per_ip: 50

password:
  min_length: 8
  require_letter_number: true
  max_age_days: 0        # 密码最长有效期；>0 时登录返回 password_expired / must_change_password
  history_count: 5       # 禁止重复使用最近 N 次密码；0=禁用
  notify_login_email: false # 新设备登录邮件提醒
  notify_login_sms: false   # 新设备登录短信提醒（站内通知始终写入）

mq:
  enabled: false
  name_server: "127.0.0.1:9876"
  producer_group: "uac_producer"
  sms_topic: "uac_sms"
  email_topic: "uac_email"

sms:
  provider: mock # mock | mq | aliyun | tencent
  # 开发环境验证码会打到日志；生产通过 MQ 异步发短信，或直连云厂商
  access_key_id: ""
  access_key_secret: ""
  sign_name: ""      # 短信签名
  template_code: ""  # 短信模板 ID
  region: ""         # 阿里云 cn-hangzhou / 腾讯云 ap-guangzhou
  app_id: ""         # 腾讯云 SmsSdkAppId

email:
  provider: mock # mock | mq | aliyun | tencent
  access_key_id: ""
  access_key_secret: ""
  sign_name: ""
  template_code: ""
  region: ""
  from: ""           # 发信地址，如 no-reply@example.com

oauth:
  providers:
    github:
      kind: generic
      client_id: ""
      client_secret: ""
      auth_url: "https://github.com/login/oauth/authorize"
      token_url: "https://github.com/login/oauth/access_token"
      userinfo_url: "https://api.github.com/user"
      scopes: ["read:user", "user:email"]
    google:
      kind: google
      client_id: ""
      client_secret: ""
      scopes: ["openid", "email", "profile"]
    apple:
      kind: apple
      client_id: ""
      client_secret: ""
      scopes: ["name", "email"]
    dingtalk:
      kind: dingtalk
      client_id: ""
      client_secret: ""
      scopes: ["openid"]
    feishu:
      kind: feishu
      client_id: ""
      client_secret: ""
      scopes: ["openid"]
    wechat:
      kind: wechat
      client_id: ""      # appid
      client_secret: ""  # appsecret
      # auth/token/userinfo 有默认值，可省略
      scopes: ["snsapi_login"]
    wecom:
      kind: wecom
      client_id: ""      # corpid
      client_secret: ""  # corpsecret
      scopes: ["snsapi_base"]

bootstrap:
  # 启动时若不存在则创建默认应用，便于本地联调
  create_default_app: true
  default_client_id: "app_demo"
  default_client_secret: "demo_secret_change_me"
  default_allowed_methods:
    - phone_otp
    - phone_password
    - email_otp
    - email_password
    - oauth2
  default_redirect_uris:
    - "http://localhost:3000/callback"
  auto_register: true

risk:
  lock_after_failures: 10
  lock_window_sec: 900
  lock_duration_sec: 900
  require_mfa_on_new_device: true
  alert_webhook_url: ""

webauthn:
  rp_display_name: "Unified Account Center"
  rp_id: "localhost"
  rp_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
