server:
  addr: ":8080"
  # Docker 默认 release，但需显式配置非默认密钥；本地 compose 演示仍用固定值并允许启动
  mode: debug

admin:
  token: "admin-dev-token"

database:
  driver: mysql
  dsn: "root:root@tcp(mysql:3306)/unified_account?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle: 10
  max_open: 50

redis:
  addr: "redis:6379"
  password: ""
  db: 0

jwt:
  alg: RS256
  secret: "dev-change-me-unified-account-center-secret"
  issuer: "unified-account-center"
  access_ttl: 7200
  refresh_ttl: 2592000
  private_key_path: "/tmp/uac_jwt_rsa.pem"
  public_key_path: "/tmp/uac_jwt_rsa_pub.pem"
  kid: "rsa-1"

captcha:
  enabled: false
  provider: mock
  site_key: ""
  secret_key: ""

otp:
  length: 6
  ttl: 300
  resend_interval: 60
  max_tries: 5
  daily_limit_per_identity: 20
  daily_limit_per_ip: 50

password:
  min_length: 8
  require_letter_number: true

mq:
  enabled: false
  name_server: "rocketmq:9876"
  producer_group: "uac_producer"
  sms_topic: "uac_sms"
  email_topic: "uac_email"

sms:
  provider: mock

email:
  provider: mock

oauth:
  providers:
    github:
      kind: generic
      client_id: ""
      client_secret: ""
      auth_url: "https://github.com/login/oauth/authorize"
      token_url: "https://github.com/login/oauth/access_token"
      userinfo_url: "https://api.github.com/user"
      scopes: ["read:user", "user:email"]
    wechat:
      kind: wechat
      client_id: ""
      client_secret: ""
      scopes: ["snsapi_login"]
    wecom:
      kind: wecom
      client_id: ""
      client_secret: ""
      scopes: ["snsapi_base"]

bootstrap:
  create_default_app: true
  default_client_id: "app_demo"
  default_client_secret: "demo_secret_change_me"
  default_allowed_methods:
    - phone_otp
    - phone_password
    - email_otp
    - email_password
    - oauth2
  default_redirect_uris:
    - "http://localhost:3000/callback"
    - "http://localhost:8080/admin/"
  auto_register: true

risk:
  lock_after_failures: 10
  lock_window_sec: 900
  lock_duration_sec: 900
  require_mfa_on_new_device: true
  alert_webhook_url: ""

webauthn:
  rp_display_name: "Unified Account Center"
  rp_id: "localhost"
  rp_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
